<div id="translation" class="hide">firewall</div>
<div ng-controller="firewallController" ng-cloak>
  <!--Breadscrumbs starts here -->
  <div class="row ltq_breadcrumbs">
    <div ng-repeat="breadcrumb in $root.breadcrumbs">
      <ng-switch on="$first">
        <div class="btn-group btn-breadcrumb1" ng-switch-when="true">
          <div class="ltq_brd_home">
            <a class="btn" ng-click="homefun()" ng-href="#/{{breadcrumb.path}}">
              <i class="fa fa-home"></i>
              {{breadcrumb.name}}
            </a>
          </div>
        </div>

        <div class="btn-group btn-breadcrumb" ng-switch-when="false">
          <span
            class="btn btn-default not-active"
            ng-if="breadcrumb.path == 'nothing' || $last == true"
          >
            {{breadcrumb.name}}
          </span>
          <span
            ng-if="breadcrumb.path != 'nothing' &&
                                            $last == false"
          >
            <a class="btn" ng-href="#/{{breadcrumb.path}}">
              <i></i>
              {{breadcrumb.name}}
            </a>
          </span>
        </div>
      </ng-switch>
    </div>
  </div>
  <!--Breadscrumbs ends here -->
  <div class="subheader">
    <div>
      <img src="images/icons/firewall.png" class="iconDetails" alt="img" />
    </div>
    <div><h4 ng-bind="'firewall.headername' | translate"></h4></div>
    <p ng-bind="'firewall.headerdescription' | translate"></p>
  </div>
  <div class="row" ng-show="formnamepopup">
    <div class="alert alert-danger">
      <a class="close" aria-label="close" ng-click="popupclose('formnamepopup')"
        >&times;</a
      >
      <strong ng-bind="'Warning!' | translate"></strong
      ><span ng-bind="formnamepopupval"></span>
    </div>
  </div>
  <div class="row" ng-show="DeviceFirewallChain1Rulepopup">
    <div class="alert alert-danger">
      <a
        class="close"
        aria-label="close"
        ng-click="popupclose('DeviceFirewallChain1Rulepopup')"
        >&times;</a
      >
      <strong ng-bind="'Warning!' | translate"></strong
      ><span ng-bind="DeviceFirewallChain1Rulepopupval"></span>
    </div>
  </div>
  <div class="row" ng-show="DeviceFirewallChain2Rulepopup">
    <div class="alert alert-danger">
      <a
        class="close"
        aria-label="close"
        ng-click="popupclose('DeviceFirewallChain2Rulepopup')"
        >&times;</a
      >
      <strong ng-bind="'Warning!' | translate"></strong
      ><span ng-bind="DeviceFirewallChain2Rulepopupval"></span>
    </div>
  </div>
  <div class="row" ng-show="DeviceFirewallChain3Rulepopup">
    <div class="alert alert-danger">
      <a
        class="close"
        aria-label="close"
        ng-click="popupclose('DeviceFirewallChain3Rulepopup')"
        >&times;</a
      >
      <strong ng-bind="'Warning!' | translate"></strong
      ><span ng-bind="DeviceFirewallChain3Rulepopupval"></span>
    </div>
  </div>
  <div class="row" ng-show="postnamepopup">
    <div class="alert alert-danger">
      <a class="close" aria-label="close" ng-click="popupclose('postnamepopup')"
        >&times;</a
      >
      <strong ng-bind="'Warning!' | translate"></strong
      ><span ng-bind="postnamepopupval"></span>
    </div>
  </div>
  <div
    class="help_toggle helpshow"
    ng-class="$root.scopevariable ? 'helpshow' : 'helphide'"
    ng-init="$root.scopevariable=true"
  >
    <div class="help_txtcontent">
      <a
        helpfile="languages/*/{{'firewall.helpkey' | translate}}"
        ng-click="helpTextDetails($event)"
        href=""
      >
        <i class="fa fa-info circle_bg"></i>
      </a>
      <div class="help_content" ng-include="$root.helpfile"></div>
    </div>
  </div>
  <div class="row">
    <div class="panel">
      <div class="panel-heading blu_bg">
        <span class="panel_heading_icon"
          ><img src="images/icons/settings-1.png" alt="panel-icon"/></span
        ><span ng-bind="'firewall.panelheader' | translate"></span>
      </div>
      <div class="panel-body">
        <div class="">
          <div class="row pt-1 pb-3">
            <div class="col-md-4 mt-1 mbl-no-padding-hr">
              <div class="checkbox1 input-field1">
                <input
                  id="DeviceFirewall_Enable"
                  name="Enable"
                  type="checkbox"
                  ng-change="customtextchange('Enable')"
                  ng-model="DeviceFirewall.Enable"
                  title="enable"
                  ng-true-value="'1'"
                  ng-false-value="'0'"
                />
                <label
                  class="checkbox_left_align"
                  for="DeviceFirewall_Enable"
                  ng-bind="'Device.Firewall.Enable' | translate"
                  >:&nbsp;&nbsp;
                </label>
                <span
                  class="error"
                  forname="DeviceFirewall_Enable"
                  ng-show="DeviceFirewall_Enableresponsestatus"
                  ng-bind="DeviceFirewall_Enableval"
                >
                </span>
              </div>
            </div>
            <div class="col-md-4 d-flex align-items-center">
              <label class="w-50" for="firewallLevel">Firewall Level</label>
              <select
                id="firewallLevel"
                name="firewallLevel"
                ng-model="firewallLevel"
                ng-required="true"
                class="form-control small"
              >
                <option ng-repeat="level in firewallLevels" value="{{level}}"
                  >{{level}}</option
                >
              </select>
            </div>
          </div>
          <div class="row no-margin-hr ">
            <table
              class="table_txt_align_v thfixed theme_intel no-margin-vr table table-bordered table-responsive"
            >
              <thead>
                <tr>
                  <th
                    ng-bind="'Device.Firewall.Chain.*.Rule.Service Description' | translate"
                  ></th>
                  <th
                    ng-bind="'Device.Firewall.Chain.*.Rule.Service Port' | translate"
                  ></th>
                  <th
                    ng-bind="'Device.Firewall.Chain.*.Rule.Traffic In (LAN hosts to CPE)' | translate"
                  ></th>
                </tr>
              </thead>
              <tbody>
                <tr ng-repeat="tableCellData in tableArray">
                  <td>{{tableCellData.Description}}</td>
                  <td>
                    {{tableCellData.DestPort == '-1' ? "NA" :
                    tableCellData.DestPort}}
                  </td>
                  <td>
                    <div
                      class="fa fa-2x"
                      ng-style="{'cursor':'pointer'}"
                      ng-click="toggleIcon(tableCellData.trafficinobject, tableCellData.trafficin, tableCellData, 'trafficin')"
                      ng-class="tableCellData.trafficin=='Accept'?'fa-check grn_clr':'fa-times mrn_clr'"
                    ></div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <div class="text-right col-lg-12 col-md-12">
      <div class="btn-group text-center">
        <button
          class="btn btn-info waves-effect waves-light"
          id="Modify"
          value="Save"
          ng-click="firewallApply()"
          title="Apply"
        >
          <span class="" ng-bind="'Save' | translate"></span>
        </button>
      </div>
    </div>
  </div>
</div>
